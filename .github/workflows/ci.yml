name: CI

# The repository's only defences against a red `main` were local git hooks, and
# both are bypassable with `--no-verify`. A deterministic test in
# `crates/add-scenario` — the contract `README.md` names as the definition of a
# complete gameplay change — stayed red on `main` for five days because the gate
# ran `cargo check` instead of `cargo test` and nothing noticed. This workflow
# exists so that class of failure is caught by the repository rather than by the
# next person who happens to read the output.
#
# ADD is the active product lane. The archived office app retains a separate
# maintenance job so its preserved reference build cannot break silently.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap, fast, and catches the most common mistakes: whitespace, the content
  # pipeline, the authoritative Rust rules, and the TypeScript boundary.
  gameplay:
    name: Gameplay verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/add-core, crates/add-scenario, crates/add-scenario-runner, crates/add-web-bindings, crates/add-ink-compiler -> target

      # wasm-pack builds the ADD runtime that the browser and worker both load.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install Playwright and its browser
        run: |
          npm --workspace @aedventure/add-rpg exec playwright install --with-deps chromium

      # The gate an ADD developer actually runs. It executes
      # `cargo test --workspace`, which is the step the old single gate got wrong.
      - name: ADD lane gate
        run: npm run check:add

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: add-lane-artifacts
          path: |
            artifacts/agent-verification/
            apps/add-rpg/dist-app/
          retention-days: 7
          if-no-files-found: ignore

  # Archived office/platform regression coverage. This is maintenance evidence,
  # not an active product lane or a prerequisite for ADD feature work.
  office:
    name: Office lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-office-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-office-

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Playwright and its browser
        run: |
          npx playwright install --with-deps chromium

      - name: Archived office maintenance gate
        run: npm run check:office

  # A real gate.
  #
  # This started advisory: both steps were red on `main`, with `continue-on-error`
  # so the rest of the pipeline would not look untrusted on day one. That is now
  # paid off -- `cargo fmt --all` has been run and all 52 clippy warnings are
  # cleared -- so the escape hatch is gone and `-D warnings` is on. Without it
  # clippy exits zero with warnings printed, and a job that cannot fail is a job
  # nobody reads.
  #
  # The `narrative` module carries one crate-level `allow` for
  # `should_implement_trait`; the reasoning is on it. Nothing else is silenced
  # at the crate level, and `-D warnings` is what keeps it that way.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
